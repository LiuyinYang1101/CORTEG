[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corteg"
version = "0.1.0"
description = "CORTEG: Foundation models enable cross-modality representation transfer from scalp EEG to intracranial ECoG."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "timm>=1.0",
    "einops>=0.7",
    "h5py>=3.8",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# mne is imported lazily: by data/stanford_preprocessing (raw -> *_features.pkl)
# and by the LaBraM baseline for its channel montage. Not needed to train or
# evaluate CORTEG from the prepared files.
mne = ["mne>=1.6"]
wandb = ["wandb>=0.16"]

[project.urls]
Paper = "https://arxiv.org/abs/2605.10337"
Repository = "https://github.com/LiuyinYang1101/CORTEG"

[tool.setuptools]
py-modules = ["paths", "load_corteg", "ieeg_fm"]

[tool.setuptools.packages.find]
include = ["data*", "models*", "train*", "experiments*"]
exclude = ["docs*", "scripts*", "notebooks*", "results*", "checkpoints*", "tests*"]
