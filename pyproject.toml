[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corteg"
version = "0.1.0"
description = "CORTEG: Foundation models enable cross-modality representation transfer from scalp EEG to intracranial ECoG."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "timm>=1.0",
    "einops>=0.7",
    "h5py>=3.8",
    "scikit-learn>=1.3",
    "joblib>=1.2",        # parallel per-electrode probes; also a scikit-learn dependency
]

[project.optional-dependencies]
# mne is used only by the Stanford preprocessing (data/stanford_preprocessing,
# raw -> *_features.pkl). Not needed to train or evaluate CORTEG from the
# prepared files.
mne = ["mne>=1.6"]
# Intracranial foundation-model baselines (ieeg_fm.py). The BrainBERT and PopT
# checkpoints pickle OmegaConf configs, so loading either one needs omegaconf, and
# the PopT weights come from the Hugging Face Hub. Brant needs only the core
# dependencies. The model code itself comes from the upstream repositories named in
# ieeg_fm.py and imports only torch; there is no need to install their
# requirements.txt files (PopT's pins numpy 1.24 and scipy 1.10).
ieeg-fm = ["omegaconf>=2.3", "huggingface_hub>=0.20"]

[project.urls]
Paper = "https://arxiv.org/abs/2605.10337"
Repository = "https://github.com/LiuyinYang1101/CORTEG"

[tool.setuptools]
py-modules = ["paths", "load_corteg", "ieeg_fm"]

[tool.setuptools.packages.find]
include = ["data*", "models*", "train*", "experiments*"]
exclude = ["docs*", "scripts*", "notebooks*", "results*", "checkpoints*", "tests*"]
