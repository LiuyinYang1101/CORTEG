[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corteg"
version = "0.1.0"
description = "CORTEG: Foundation models enable cross-modality representation transfer from scalp EEG to intracranial ECoG."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "timm>=1.0",
    "einops>=0.7",
    "h5py>=3.8",
    "scikit-learn>=1.3",
    "tensorly>=0.8",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.7", "tqdm>=4.65", "pyyaml>=6.0"]
ghent = ["mne>=1.6"]
wandb = ["wandb>=0.16"]

[project.urls]
Paper = "https://arxiv.org/abs/TODO"
Repository = "https://github.com/LiuyinYang1101/CORTEG"

[tool.setuptools]
py-modules = ["paths"]

[tool.setuptools.packages.find]
include = ["data*", "models*", "train*", "experiments*"]
exclude = ["docs*", "scripts*", "baselines*", "results*", "checkpoints*", "tests*"]
